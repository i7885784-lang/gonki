name: Проверка опубликованной игры Sites
on:
  push:
    paths: ['.github/workflows/live-site.yml', 'tests/live-site.mjs']
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/live-site.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site
          path: live-site.png
