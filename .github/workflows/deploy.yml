name: Проверка и публикация
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rally-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
  browsers:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        backend: [worker, node, peer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Node — HTTP и WebSocket
        if: matrix.backend == 'node'
        run: npm run test:server
      - name: Два браузера, голос и полный заезд
        run: |
          case "${{ matrix.backend }}" in
            worker) node scripts/ci-server.mjs ;;
            node) node scripts/ci-server.mjs --node ;;
            peer) npm run test:peer -- --public-broker ;;
          esac
        env:
          CHROMIUM_PATH: playwright
      - uses: actions/upload-pages-artifact@v3
        if: matrix.backend == 'peer' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist-pages
      - name: Проверка пакета Worker
        if: matrix.backend == 'worker'
        run: npx wrangler deploy --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.backend }}-screenshots
          path: work/screenshots
  deploy:
    needs: [check, browsers]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_CLOUDFLARE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Проверить подключение аккаунта
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Добавьте CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID в секреты репозитория. Публикация ещё не выполнена.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run deploy
      - name: Проверить публичную комнату двумя клиентами
        run: |
          export TEST_ORIGIN="$(cat work/deploy-url.txt)"
          npm run test:integration
          echo "### Адрес игры" >> "$GITHUB_STEP_SUMMARY"
          cat work/deploy-url.txt >> "$GITHUB_STEP_SUMMARY"

  pages:
    needs: [check, browsers]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Проверить опубликованную игру
        run: npm run test:browser
        env:
          CHROMIUM_PATH: playwright
          TEST_P2P: "1"
          TEST_ORIGIN: ${{ steps.deployment.outputs.page_url }}
