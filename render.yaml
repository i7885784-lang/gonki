services:
  - type: web
    name: rally-together
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302
